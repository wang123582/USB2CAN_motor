serve_windmill_manager:
  ros__parameters:
    motors:
      master_name: "DJI3508_1"   # 主电机 joint_name（出力，电流取反于 M2）
      encoder_name: "DJI3508_2"  # 编码器源 joint_name（角度/转速反馈均来自此电机）
      direction: 1               # 方向乘子：+1 或 -1，同时翻转角度反馈与电流输出

    angles_deg:
      wind_up: 190.0      # 引拍幅度（度）：从 home 反转多少度，越大蓄力越足
      fire_end: 70.0      # 开火结束角（度）：超过 home+fire_end 后切入刹停
      catch_start: 270.0  # 接住开始角（度）：超过 home+catch_start 后进入 CATCH 制动
      catch_target: 360.0 # 接住目标角（度）：PD 制动终点，360°=回到 home 位置整圈

    current_limits:
      fire: 1000           # FIRE 阶段满推电流（raw），16384≈20A，决定击球速度
      wind_up_max: 3000    # WIND_UP 阶段 PD 输出限幅（raw），防止引拍冲撞限位
      catch_max: 8000      # CATCH 阶段 PD 输出限幅（raw），制动力
      global_max: 14000    # 全局硬上限（raw），任何阶段不超过此值

    gains:
      wind_up:
        kp: 100.0  # 引拍位置增益（raw/deg）：误差 1°→输出 100 raw
        kd: 3.0    # 引拍速度阻尼（raw/RPM）：转速 1 RPM→扣 3 raw，抑制超调
      catch:
        kp: 60.0   # 接住位置增益
        kd: 4.0    # 接住速度阻尼，制动阶段可比引拍大
      gravity_ff_current: 0  # 重力前馈（raw）：叠加到 PD 输出补偿臂自重
                             # 调法：kp=kd=0，缓慢加电流到臂刚好悬停，记下该值（通常 1500~3000）

    homing:
      vel_threshold_rpm: 8.0   # 归零速度阈值（RPM）：低于此值才认为臂静止
      stable_duration_s: 1.0   # 归零稳定时长（s）：持续静止超过此时间才记录 home 零位

    free_wheel:
      vel_threshold_rpm: 20.0  # 惯性滑行退出速度阈值（RPM）：速度过低提前进入 CATCH

    safety:
      runaway_threshold_deg: 360.0  # 飞车保护阈值（度）：任意状态下角位移超过此值立即 E_STOP

    control:
      frequency: 200.0            # 控制循环频率（Hz）
      position_tolerance_deg: 3.0 # CATCH 到位容差（度）：误差小于此值且转速低则判定到位
