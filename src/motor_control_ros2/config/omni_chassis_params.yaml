chassis_control_node:
  ros__parameters:
    control_frequency: 100.0        # 控制循环频率（Hz）
    cmd_vel_topic: "/cmd_vel"       # 订阅速度指令话题（geometry_msgs/Twist）
    cmd_timeout: 0.5                # 速度指令超时（s），超时后底盘停止

    # ── 底盘机械参数 ───────────────────────────────────────────────────
    # 布局：矩形四舵轮
    #   FL (左前): (+lx, +ly)    FR (右前): (+lx, -ly)
    #   RL (左后): (-lx, +ly)    RR (右后): (-lx, -ly)
    wheel_base_x: 0.650   # 前后轴距（m），需根据实际测量填写
    wheel_base_y: 0.620   # 左右轮距（m），需根据实际测量填写
    wheel_radius:  0.05  # 驱动轮半径（m），需根据实际填写
    drive_gear_ratio: 19.0  # GM3508 内置减速比（固定 19:1，无需修改）

    # ── 速度限幅 ──────────────────────────────────────────────────────
    max_linear_velocity: 2.0    # 线速度上限（m/s）
    max_angular_velocity: 3.0   # 角速度上限（rad/s）

    # ── 左前轮 (FL) ───────────────────────────────────────────────────
    fl_steer_motor: "DJI6020_3"   # GM6020 转向电机（motors.yaml 中的 joint_name），左前=3号
    fl_drive_motor: "DJI3508_3"   # GM3508 驱动电机，左前=3号
    fl_steer_offset: 295.9   # 编码器零位偏移（度）：正前方时电机编码器示数；上电标定后填入
    fl_steer_direction: -1  # 实测 GM6020 编码器正方向为顺时针（俯视），与运动学 CCW 约定相反：横移左右颠倒+自转呈 X 形（径向），四轮统一取反
    fl_drive_direction: -1  # 左侧轮组镜像安装：实测前进命令下左侧向后滚，取反

    # ── 右前轮 (FR) ───────────────────────────────────────────────────
    fr_steer_motor: "DJI6020_4"   # 右前=4号
    fr_drive_motor: "DJI3508_4"
    fr_steer_offset: 301.2
    fr_steer_direction: -1  # 同 FL，编码器方向取反
    fr_drive_direction: 1

    # ── 左后轮 (RL) ───────────────────────────────────────────────────
    rl_steer_motor: "DJI6020_2"   # 左后=2号
    rl_drive_motor: "DJI3508_2"
    rl_steer_offset: 358.6
    rl_steer_direction: -1  # 同 FL，编码器方向取反
    rl_drive_direction: -1  # 左侧轮组镜像安装，同 FL 取反

    # ── 右后轮 (RR) ───────────────────────────────────────────────────
    rr_steer_motor: "DJI6020_1"   # 右后=1号
    rr_drive_motor: "DJI3508_1"
    rr_steer_offset: 240.1
    rr_steer_direction: -1  # 同 FL，编码器方向取反
    rr_drive_direction: 1
