# Delta 机械臂管理器配置文件
# 节点：delta_arm_manager
# 控制对象：3 路 GO8010 电机

# 控制频率（Hz，默认 200Hz）
control_frequency: 200.0

# 初始化参数（软着陆阶段）
initialization:
  # 软着陆施加的向下力矩（Nm，负值表示向下）
  # 转子侧 0.15 Nm × 减速比 6.33 = 输出端 0.95 Nm（远超静摩擦上限 0.40 Nm）
  downward_torque: -0.00
  # 软着陆超时时间（秒）
  landing_timeout: 5.0
  # 着陆判定：三电机速度反馈绝对值均小于此阈值（rad/s）视为落稳
  landing_velocity_threshold: 0.3
  # 着陆稳定判定：连续保持上述条件的时间（秒）
  landing_stable_duration: 0.8
  # 软着陆阶段阻尼系数（限制下降速度，减少电机间差异）
  landing_kd: 0.05

  # 重力补偿前馈力矩（Nm，转子侧）
  gravity_compensation_torque: 0.8

  # 软着陆逐周期数据记录（定位"刚开始的向下力"来源）；调完置 false 关掉
  # 抓取：ros2 run ... delta_arm_manager 2>&1 | grep LANDING_CSV > landing.csv
  debug_log: false

# PD 控制参数（EXECUTE 阶段位置控制）
# 注意：kp/kd 作用于电机转子侧，输出端力矩 = τ_rotor × 减速比 6.33
pd:
  kp: 0.75
  kd: 0.25

# 运动规划参数（梯形速度规划）
motion_profile:
  # 上抛速度上限 (rad/s)=出手速度上限。球在顶部撞挡块急停脱手，故这就是球速上限。
  # 但 ~1.6rad 行程下峰速主要受 max_acceleration 卡（见下），两个一起抬才有效。
  max_velocity: 22
  # 最大加速度（rad/s²）：上抛峰速≈√(2×a×行程)。50→150（√(2×150×1.6)≈21.9rad/s）。
  # 电机有力气、球在顶撞停脱手，故上抛不减速、全程满加速冲挡块，加速度就是提速主杠杆。
  # ⚠️ 越大撞挡块越猛，注意挡块/减速箱冲击寿命；不够高继续加，太猛降一点。
  max_acceleration: 150
  # 减速段比例增益：距目标 max_velocity/planner_p_gain rad 时开始减速
  planner_p_gain: 25
  # ===== 上抛冲顶部限位（硬件同步 + 撞停脱手）=====
  # 球在顶部靠机械臂撞挡块急停才飞出 → 出手速度=撞挡块前臂速，故上抛全程满加速、绝不减速；
  # 三路同时撞各自挡块→一起停→硬件同步，再从同步态收拍。（不再有"缓一下"软压，那会砍出手速度）
  top_press_margin_rad: 0.10    # 目标压到限位再往上此值，PD 持续满力冲/压向挡块
  top_approach_band_rad: 0.20   # 撞停判定的"已到顶"位置带（实际角进入 target-此值 才算到顶）
  stop_settle_vel: 0.5          # 撞停判据：三路实际速度都低于此值(rad/s)=撞挡块停住→转收拍

# 安全参数
safety:
  # 最大允许高度（米，仅参考，实际以角度控制）
  max_height: 0.4
  # 位置误差钳位（rad）：限制 PD 控制器看到的最大位置误差
  # 防止大误差产生过大力矩导致振荡。0.5 rad ≈ 29°
  # τ_max = kp × max_pos_error × gear_ratio = 0.75 × 0.5 × 6.33 = 2.37 Nm
  max_position_error: 0.5
  # ArmTarget 三路目标角度允许差异阈值（rad）；实测各电机行程有偏差，放宽到 5°
  angle_diff_tolerance: 0.0873

# 目标到达容差（rad）：电机角度与目标的差小于此值视为到达
position_tolerance: 0.05

# 自适应规划：当电机实际位置与规划位置差超过此值时暂停规划器
# 防止规划器跑在电机前面太远
tracking_error_pause: 3.0


# 解耦控制零点（固定 0 rad）：软着陆完成瞬间将当前物理角锁定为零点
# 后续控制全部采用相对增量，且三电机增量应保持一致
decoupled_zero_rad: 0.0

# EXECUTE 超时（秒）：上抛阶段超时后强制快速收拍
top_idle_timeout: 1.0

# 运动流程超时参数
serve_test:
  retract_timeout_s: 0.30       # 快速收拍超时（s）
  tilt_timeout_s: 0.70          # 俯仰运动超时（s）

# 快速收拍参数：三路上抛电机反向梯形规划回相对 0 度
# 速度优先：max_velocity/accel 可高于 execute 段；位置钳位对收拍关闭（代码内 bypass）
retract:
  kp: 1.50            # ↑ 拉回更猛（原 0.80）
  kd: 0.15
  torque_ff: -0.5     # ↑ 向下前馈助力回落 + 抵消重力（原 -0.3）
  max_velocity: 18    # 收拍下降速度上限 (rad/s)。同步已交给顶部挡块，这里放开提速。
                       #   注：~1.7rad 行程下峰速同时受 max_acceleration 约束(见下)，两个一起抬才有效。
                       #   （12→18；仍不够再往上，但注意底部无挡块、越快反弹越明显）
  max_acceleration: 130 # 收拍加速度上限 (rad/s²)。短行程主要瓶颈：三角轨迹峰速≈√(a×行程)。
                        #   80→130（√(130×1.7)≈14.9rad/s）。仍慢再加大，代价是到底冲击更猛。
  # 简化版收拍：顶部限位已把三路对齐，从同步态一起开环下降回 0（不再做 lead_cap 牵引/滞后预测，
  # 那套在低反馈率下自身会锯齿；同步已由硬件挡块解决）。仅保留底部软着陆防砸底反弹。
  bottom_soft_rad: 0.35 # 底部软着陆：实际角低于此值撤下向下前馈，软停防带速砸机械底反弹出现 +/- 割裂
                        #   （0.25→0.35：提速后到底更猛，提前撤向下前馈。底部无挡块，反弹严重再加大）
  debug_log: false     # 收拍逐周期数据记录（定位卡顿用）；调完置 false 关掉
                      # 抓取：ros2 run ... delta_arm_manager 2>&1 | grep RETRACT_CSV > retract.csv

# 俯仰 GO8010
# 零点：节点收到首帧在线反馈时锁定当前物理角为零点，以下角度均为相对零点
# （上电/启动节点前务必让俯仰处于躺平待机位）
# 方向：正角/正力矩 = 向上抬起（0=躺平）；松力矩臂会靠重力掉回 0，需 +（向上）前馈托住。
# 击球角由上层 ArmTarget topic 的 tilt_angle_rad 字段实时指定，此处不配置。
tilt:
  name: "arm_tilt_motor"       # joint_name，对应 motors.yaml arm_tilt_motor
  ready_angle_rad: 0.0         # 待机角度（rad，相对零点）：机械臂躺平位置
  # ===== 简化俯仰：一直挂恒定向上前馈托住臂自重 + 单一 PD，抬起/回摆共用一套 =====
  kp: 2.0                      # 单一位置增益（抬起/回摆共用）
  kd: 0.30                     # 单一速度阻尼
  hold_torque_ff: 1.5          # 恒定向上前馈（Nm，+）：一直托住臂自重，全程都挂。
                               #   臂往待机(0)方向掉→调大；待机位顶离挡块/嗡嗡响→调小
  rate_rad_s: 6.0              # 命令角滑向目标的单一限速（rad/s）：1.6rad 约 0.27s 到位，防齿轮冲击
  position_tolerance: 0.05     # 到位容差（rad），误差小于此值判定到位
  max_position_error: 0.90     # 位置误差钳位（rad）：↑ 放宽，让 PD 跑满力矩提速（原 0.50）
                               # 力矩上限 = kp×此值 = 2.0×0.9 = 1.8Nm（原 0.5Nm，3.6x）


# 电机名称与 ID（对应 motors.yaml 中的 joint_name）
# max_delta_rad：实测最大上抛行程（相对软着陆零点），超过此值将被 armTargetCallback 拒绝
#   Motor1: 92.358° = 1.612 rad   Motor2: 92.290° = 1.611 rad   Motor3: 89.748° = 1.567 rad
motors:
  - name: "arm_delta_motor_1"
    max_delta_rad: 1.612
  - name: "arm_delta_motor_2"
    max_delta_rad: 1.611
  - name: "arm_delta_motor_3"
    max_delta_rad: 1.567

# 串口通信参数（针对 USB-RS485 适配器响应延迟优化）
serial:
  wait_ms: 4          # 发送后等待时间（原2ms，放宽以适应慢适配器）
  timeout_ms: 12      # 接收总超时（原8ms，放宽减少首次失败率）
